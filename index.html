<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Healthy For Life Recipe Book">
    <meta name="author" content="Lifepointe Chiropractic">
    <meta name="keywords" content="healthy, recipes, food, diet, lifestyle, homemade, natural, wellness">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="Healthy For Life Recipe Book">
    <meta property="og:description" content="Healthy For Life Recipe Book, by Lifepointe Chiropractic">
    <meta property="og:image" content="images/lifepointe.png">
    <meta property="og:url" content="https://rramboer.github.io/recipe-book">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Healthy For Life Recipe Book">
    <meta name="twitter:description" content="Healthy For Life Recipe Book, by Lifepointe Chiropractic">
    <meta name="twitter:image" content="images/lifepointe.png">
    <meta name="twitter:image:alt" content="Healthy For Life Recipe Book">

    <link rel="icon" href="images/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.js"></script>

    <title>Healthy For Life Recipe Book</title>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-41R0E5XNRY"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-41R0E5XNRY');
    </script>
</head>

<body>
    <div id="app">
        <nav class="navbar navbar-expand-xxl navbar-dark bg-primary bg-gradient">
            <a class="navbar-brand px-2" href="#/" @click="home()">Healthy For
                Life</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarToggler"
                aria-controls="navbarToggler" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarToggler">
                <ul v-for="(category,i) in categories" class="navbar-nav m-auto px-auto">
                    <li class="nav-item px-3">
                        <a @click="toggle(category,i)" class="nav-link" :class="{activeCategory:category.toggle === i}"
                            href="#" data-bs-toggle="collapse"
                            data-bs-target=".navbar-collapse.show">{{category.name}}</a>
                    </li>
                </ul>
                <form class="d-flex search-form" role="search" @submit.prevent="search()">
                    <input class="form-control me-2" type="search" placeholder="Search recipes..."
                        aria-label="Search recipes" v-model="searchQuery">
                    <button class="btn btn-outline-light" type="submit">Search</button>
                </form>
            </div>
        </nav>

        <div v-if="current === 'home'"
            class="home container-fluid row row-cols-2 row-cols-xs-2 row-cols-md-3 row-cols-xl-4 g-4 g-lg-5">
            <div v-for="(category,c) in categories">
                <div class="card h-100 bg-primary bg-gradient border-secondary">
                    <a @click="toggle(category,c)" class="stretched-link" role="button"
                        :aria-label="'Browse ' + category.name + ' recipes'"></a>
                    <img :src="category.image" class="card-img-top" :alt="category.name">
                    <div class="card-body">
                        <p class="card-title">{{category.name}}</p>
                    </div>
                </div>
            </div>
        </div>

        <div v-if="current === 'category'"
            class="cat container-fluid row row-cols-2 row-cols-xs-2 row-cols-md-3 row-cols-xl-4 g-4 g-lg-5">
            <div class="w-100 cat-title text-bg-dark">{{categories[activeCategory].name}}</div>
            <div v-for="recipe in recipes">
                <div class="card h-100 bg-dark border-primary">
                    <a @click="showRecipe(recipe)" class="stretched-link" role="button"
                        :aria-label="'View recipe: ' + recipe.title"></a>
                    <img :src="recipe.image" class="card-img-top" :alt="recipe.title">
                    <div class="card-body">
                        <p class="card-title">{{recipe.title}}</p>
                    </div>
                </div>
            </div>
        </div>

        <div v-if="current === 'search'"
            class="cat container-fluid row row-cols-2 row-cols-xs-2 row-cols-md-3 row-cols-xl-4 g-4 g-lg-5">
            <div class="w-100 cat-title text-bg-dark">Results for "{{searchQuery}}"</div>
            <div v-if="recipes.length === 0" class="w-100 text-center" style="margin-top:20px;">
                <p>No recipes found.</p>
            </div>
            <div v-for="recipe in recipes">
                <div class="card h-100 bg-dark border-primary">
                    <a @click="showRecipe(recipe)" class="stretched-link" role="button"
                        :aria-label="'View recipe: ' + recipe.title"></a>
                    <img :src="recipe.image" class="card-img-top" :alt="recipe.title">
                    <div class="card-body">
                        <p class="card-title">{{recipe.title}}</p>
                    </div>
                </div>
            </div>
        </div>

        <div v-if="current === 'recipe'" class="recipe">
            <div class="leftSide">
                <h1 id="rec-title">{{rtitle}}</h1>
                <h5 v-if="rnotes" id="rec-notes">{{rnotes}}</h5>
                <img id="rec-image" :src="rimage" :alt="rtitle">
            </div>

            <div class="rightSide">
                <h2 id="ingredients">Ingredients</h2>
                <ul>
                    <li v-for="ingredient in ringredients">{{ingredient}}</li>
                </ul>
                <h2 id="instructions">Instructions</h2>
                <ol>
                    <li v-for="instruction in rinstructions">{{instruction}}</li>
                </ol>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
